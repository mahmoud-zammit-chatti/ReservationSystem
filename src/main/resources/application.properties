spring.application.name=DemoOTP

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
refresh.token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS}
refresh.token.secret=${REFRESH_TOKEN_SECRET}

vonage.api-key=${VONAGE_API_KEY}
vonage.api-secret=${VONAGE_API_SECRET}
vonage.whatsapp.from=${VONAGE_WHATSAPP_FROM}
vonage.messages.base-url=${VONAGE_MESSAGES_BASE_URL:https://messages-sandbox.nexmo.com/v1/messages}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_CONTAINER_NAME}
azure.documentintelligence.endpoint=${AZURE_DOC_INTELLIGENCE_ENDPOINT}
azure.documentintelligence.key=${AZURE_DOC_INTELLIGENCE_KEY}

car_status_scheduler_interval=${CAR_SCHEDULER_INTERVAL}

port_deletion_scheduler_interval=${PORT_SCHEDULER_INTERVAL}